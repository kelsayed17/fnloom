# The documentation site, built from docs/ by Zensical (`uv run --group docs zensical serve` to preview it).

[project]
site_name = "fnloom"
site_description = "A Rust dataflow engine on Hamilton's model: plain Python functions are nodes, wired by parameter name"
site_url = "https://kelsayed17.github.io/fnloom/"
repo_url = "https://github.com/kelsayed17/fnloom"
repo_name = "kelsayed17/fnloom"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Khaled Elsayed. Apache-2.0 licence. Not affiliated with or endorsed by the Apache Software Foundation or the Apache Hamilton (incubating) project."
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Guides" = [
    "getting-started.md",
    "writing-nodes.md",
    "running.md",
    "caching.md",
    "hooks.md",
    "drawing.md",
    "errors.md",
    "rust-core.md",
  ] },
  { "Apache Hamilton" = [
    "from-hamilton.md",
    { "Differences from Hamilton" = "quirk-register.md" },
    "benchmarks.md",
  ] },
  { "Project" = [
    { "Design" = "design/2026-10-26-fnloom-design.md" },
    { "Caching design" = "design/2026-10-27-caching-design.md" },
    { "Dynamic execution design" = "design/2026-10-28-dynamic-execution-design.md" },
    { "Roadmap: ahead of Hamilton" = "plans/2026-10-28-roadmap-ahead-of-hamilton.md" },
    { "Plans" = [
      { "Plan 1: the core" = "plans/2026-10-26-plan-1-core-and-native-path.md" },
      { "Plan 2: decorators and type checks" = "plans/2026-10-27-plan-2-decorators-inspection-type-checks.md" },
      { "Plan 3: config, extract and async" = "plans/2026-10-28-plan-3-config-extract-async.md" },
      { "Plan 4: caching" = "plans/2026-10-27-plan-4-result-caching.md" },
      { "Plan 5: inspection, validation and authoring" = "plans/2026-10-28-plan-5-inspection-validation-authoring.md" },
      { "Plan 6: hooks and result builders" = "plans/2026-10-28-plan-6-hooks-result-builders.md" },
      { "Plan 7: drawing, export and the CLI" = "plans/2026-10-28-plan-7-drawing-export-cli.md" },
      { "Plan 8: validators, steps and injection" = "plans/2026-10-28-plan-8-validators-steps-injection.md" },
      { "Plan 9: the long tail" = "plans/2026-10-28-plan-9-long-tail.md" },
      { "Plan 10: typed absence and fan-out" = "plans/2026-11-05-plan-10-absence-and-fan-out.md" },
      { "Plan 12: every row better than Hamilton" = "plans/2026-10-29-plan-12-api-parity-plus.md" },
    ] },
    { "Changelog" = "https://github.com/kelsayed17/fnloom/blob/main/CHANGELOG.md" },
    { "Contributing" = "https://github.com/kelsayed17/fnloom/blob/main/CONTRIBUTING.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.snippets.check_paths = true
# Mermaid diagrams render on the site as they do on GitHub.
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
