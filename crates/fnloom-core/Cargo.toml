[dependencies]

# Instruction-count benchmarks run under callgrind, which exists only on Linux, so the
# harness is a Linux-only dev-dependency; see benches/core.rs for the choice and the pin.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = "=0.18.2"

[[bench]]
name = "core"
harness = false

